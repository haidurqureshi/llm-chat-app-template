<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Chat | HaidurQureshi Ltd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Theme tokens (match the main site: stone / zinc / blue) ── */
    :root {
      --bg:          #fafaf9;
      --surface:     #ffffff;
      --surface2:    #f4f4f5;
      --border:      #e4e4e7;
      --text:        #18181b;
      --muted:       #52525b;
      --faint:       #a1a1aa;
      --accent:      #2563eb;
      --accent-text: #ffffff;
      --online:      #16a34a;
      --shadow:      0 1px 2px rgb(0 0 0 / .04), 0 12px 40px rgb(0 0 0 / .06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #09090b;
        --surface:  #0f0f11;
        --surface2: #18181b;
        --border:   #27272a;
        --text:     #fafafa;
        --muted:    #a1a1aa;
        --faint:    #52525b;
        --online:   #4ade80;
        --shadow:   none;
      }
    }

    html, body { height: 100%; }

    body {
      font-family: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    /* ── Shell: full screen on phones, floating card from tablet up ── */
    .shell {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      overflow: hidden;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (min-width: 640px) {
      body { align-items: center; padding: 1.5rem; }
      .shell {
        max-width: 720px;
        height: min(800px, 100%);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding-top: 0;
        padding-bottom: 0;
      }
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    @media (min-width: 640px) { .header { padding: 16px 24px; } }

    .avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-text);
      display: grid; place-items: center;
      font-size: 14px; font-weight: 600;
      flex-shrink: 0;
    }
    .header-meta { flex: 1; min-width: 0; }
    .name {
      font-size: 15px; font-weight: 600; letter-spacing: -0.01em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted); margin-top: 1px;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--online); }

    .back {
      font-size: 13px; font-weight: 500; color: var(--muted);
      text-decoration: none; padding: 6px 10px; border-radius: 999px;
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    .back:hover { background: var(--surface2); color: var(--text); }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    @media (min-width: 640px) { .messages { padding: 24px; } }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg { display: flex; gap: 8px; align-items: flex-end; }
    .msg.user { flex-direction: row-reverse; }

    .msg-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--accent); color: var(--accent-text);
      display: grid; place-items: center;
      font-size: 11px; font-weight: 600; flex-shrink: 0;
    }

    .bubble {
      padding: 10px 14px;
      font-size: 15px;
      line-height: 1.55;
      max-width: min(85%, 560px);
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .bubble.bot {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px 16px 16px 16px;
    }
    .bubble.user {
      background: var(--accent);
      color: var(--accent-text);
      border-radius: 16px 16px 6px 16px;
    }

    /* ── Typing indicator ── */
    .typing { display: flex; gap: 4px; align-items: center; height: 1.55em; }
    .typing span {
      width: 6px; height: 6px; background: var(--faint); border-radius: 50%;
      animation: blink 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .18s; }
    .typing span:nth-child(3) { animation-delay: .36s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }

    /* ── Suggestions ── */
    .chips {
      display: flex;
      gap: 8px;
      padding: 0 16px 12px;
      overflow-x: auto;
      flex-shrink: 0;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    @media (min-width: 640px) { .chips { padding: 0 24px 14px; flex-wrap: wrap; overflow: visible; } }

    .chip {
      font: inherit; font-size: 14px; color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
      transition: border-color .15s, background .15s;
    }
    .chip:hover { border-color: var(--accent); background: var(--surface2); }

    /* ── Composer ── */
    .composer {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    @media (min-width: 640px) { .composer { padding: 16px 24px; } }

    .composer textarea {
      flex: 1;
      resize: none;
      font: inherit;
      font-size: 16px; /* 16px stops iOS zooming on focus */
      line-height: 1.4;
      color: var(--text);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 14px;
      max-height: 140px;
      outline: none;
      transition: border-color .15s;
    }
    .composer textarea::placeholder { color: var(--faint); }
    .composer textarea:focus { border-color: var(--accent); }

    .send {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: grid; place-items: center;
      flex-shrink: 0;
      transition: transform .1s, opacity .15s;
    }
    .send:hover:not(:disabled) { transform: scale(1.06); }
    .send:disabled { opacity: .35; cursor: default; }
    .send svg { width: 18px; height: 18px; }

    /* ── Keyboard focus ── */
    .chip:focus-visible, .send:focus-visible, .back:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* ── Motion: one gentle entrance for new messages, off if requested ── */
    @media (prefers-reduced-motion: no-preference) {
      .msg { animation: rise .2s ease; }
      @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>

<div class="shell" role="main">
  <header class="header">
    <div class="avatar" aria-hidden="true">H</div>
    <div class="header-meta">
      <div class="name">HaidurQureshi Ltd Assistant</div>
      <div class="status"><span class="dot"></span> Online now</div>
    </div>
    <a class="back" href="https://haidurqureshi.com">Back to site</a>
  </header>

  <div class="messages" id="messages" role="log" aria-live="polite" aria-label="Chat messages">
    <div class="msg">
      <div class="msg-avatar" aria-hidden="true">H</div>
      <div class="bubble bot">Hi! I can tell you about HaidurQureshi Ltd and the software we build. What would you like to know?</div>
    </div>
  </div>

  <div class="chips" id="chips">
    <button class="chip" type="button">What do you do?</button>
    <button class="chip" type="button">Availability</button>
    <button class="chip" type="button">Pricing</button>
    <button class="chip" type="button">Get in touch</button>
  </div>

  <div class="composer">
    <textarea
      id="userInput"
      rows="1"
      placeholder="Type your message"
      aria-label="Type a message"
      autocomplete="off"
      enterkeyhint="send"
    ></textarea>
    <button class="send" id="sendBtn" type="button" aria-label="Send message" disabled>
      <svg viewBox="0 0 20 20" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" y1="10" x2="16" y2="10"/>
        <polyline points="11,5 16,10 11,15"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('userInput');
  const sendBtn    = document.getElementById('sendBtn');
  const chipsEl    = document.getElementById('chips');

  // Full conversation history sent to the Worker each turn
  const history = [];
  let busy = false;

  /* ── Input behaviour ── */
  function autoGrow() {
    inputEl.style.height = 'auto';
    inputEl.style.height = inputEl.scrollHeight + 'px';
  }
  function updateSendState() {
    sendBtn.disabled = busy || !inputEl.value.trim();
  }

  inputEl.addEventListener('input', () => { autoGrow(); updateSendState(); });
  inputEl.addEventListener('keydown', e => {
    // Enter sends, Shift+Enter adds a new line, and IME composition is left alone
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendMessage();
    }
  });
  sendBtn.addEventListener('click', () => sendMessage());
  chipsEl.addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    chipsEl.style.display = 'none';
    sendMessage(chip.textContent.trim());
  });

  /* ── Sending ── */
  async function sendMessage(override) {
    const text = (override ?? inputEl.value).trim();
    if (!text || busy) return;

    inputEl.value = '';
    autoGrow();
    setBusy(true);

    appendBubble('user', text);
    history.push({ role: 'user', content: text });
    scrollBottom(true);

    const typingEl = appendTyping();
    scrollBottom(true);

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });
      if (!res.ok || !res.body) throw new Error('Bad response');

      typingEl.remove();
      const botBubble = appendBubble('bot', '');

      const reader  = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      let full   = '';
      let finished = false;

      while (!finished) {
        const { done, value } = await reader.read();
        if (done) break;

        // Keep any partial line for the next chunk so tokens are never dropped
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = line.slice(6).trim();
          if (data === '[DONE]') { finished = true; break; }
          try {
            full += JSON.parse(data)?.response ?? '';
            botBubble.textContent = full;
            scrollBottom();
          } catch { /* skip non-JSON lines */ }
        }
      }

      if (full) {
        history.push({ role: 'assistant', content: full });
      } else {
        botBubble.textContent = "Sorry, I couldn't get a response. Please try again.";
        history.pop(); // drop the unanswered user message so turns stay in order
      }
    } catch (err) {
      console.error(err);
      typingEl.remove();
      appendBubble('bot', 'Something went wrong. Please try again.');
      history.pop();
    }

    setBusy(false);
    inputEl.focus();
  }

  /* ── DOM helpers ── */
  function makeAvatar() {
    const av = document.createElement('div');
    av.className = 'msg-avatar';
    av.setAttribute('aria-hidden', 'true');
    av.textContent = 'H';
    return av;
  }

  function appendBubble(role, text) {
    const row = document.createElement('div');
    row.className = `msg ${role}`;
    if (role === 'bot') row.appendChild(makeAvatar());

    const b = document.createElement('div');
    b.className = `bubble ${role}`;
    b.textContent = text;
    row.appendChild(b);
    messagesEl.appendChild(row);
    return b;
  }

  function appendTyping() {
    const row = document.createElement('div');
    row.className = 'msg';
    row.appendChild(makeAvatar());

    const b = document.createElement('div');
    b.className = 'bubble bot';
    b.setAttribute('aria-label', 'Assistant is typing');
    b.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(b);
    messagesEl.appendChild(row);
    return row;
  }

  // Only follow the stream if the reader hasn't scrolled up to re-read something
  function scrollBottom(force = false) {
    const nearBottom =
      messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 120;
    if (force || nearBottom) messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function setBusy(val) {
    busy = val;
    inputEl.disabled = val;
    updateSendState();
  }
</script>
</body>
</html>
